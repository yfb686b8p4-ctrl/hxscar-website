name: 每周SEO自动更新

on:
  schedule:
    # 每周一早上8:00（北京时间 = UTC 0:00）运行
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新（即使无变化）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  seo_update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行每周轮换脚本（更新index.html）
        run: python3 weekly_rotation.py

      - name: 生成多平台内容包
        run: python3 multi_platform_publisher.py

      - name: 检查并提交更新
        run: |
          git config user.name "华信松自动更新机器人"
          git config user.email "bot@hxscar.auto"
          git add index.html multi_platform_publisher.py platform_content/
          # 检查是否有变化
          if git diff --cached --quiet; then
            echo "⚠️ 无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "📅 每周SEO自动更新 W$(TZ='Asia/Shanghai' date '+%V') · $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git push
          echo "✅ 已推送更新（含多平台内容包）"
